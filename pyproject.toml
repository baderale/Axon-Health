[project]
name = "axon-health"
version = "0.0.1"
description = "Axon Health — AI-native medical-technology umbrella platform (prototype)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nats-py>=2.9.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.8",
    "langchain-community>=0.3.7",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
    "openai>=1.54.0",
    "structlog>=24.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "tenacity>=9.0.0",
    # Tier-1 name and place detection (axon/gatekeeper/phi.py).
    "spacy>=3.8.0,<3.9",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["axon*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
